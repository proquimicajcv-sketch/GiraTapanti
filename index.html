<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tapanti · Curación de especies</title>
    <meta name="description" content="Catálogo curado de especies observadas en Tapantí con edición segura de imágenes públicas y persistencia local." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Tapanti · identificación y curación</p>
          <h1>Catálogo visual de especies</h1>
          <p class="hero-copy">
            Revisa fichas botánicas listas para campo, ajusta la URL pública de la imagen de referencia y conserva los cambios en este navegador.
          </p>
        </div>
        <div class="hero-panel">
          <div>
            <span class="hero-label">Objetivo</span>
            <strong>Curar evidencia visual y notas descriptivas</strong>
          </div>
          <div>
            <span class="hero-label">Persistencia</span>
            <strong>localStorage seguro por especie</strong>
          </div>
        </div>
      </header>

      <main>
        <section class="toolbar" aria-label="Filtros del catálogo">
          <label class="field search-field">
            <span>Buscar especie</span>
            <input id="searchInput" type="search" placeholder="Ej. Mimosa, Monstera, helecho..." />
          </label>

          <label class="field">
            <span>Familia</span>
            <select id="familyFilter">
              <option value="all">Todas</option>
            </select>
          </label>

          <label class="field">
            <span>Estado</span>
            <select id="statusFilter">
              <option value="all">Todos</option>
            </select>
          </label>
        </section>

        <section class="results-bar" aria-live="polite">
          <p id="resultsSummary"></p>
          <button id="resetFiltersButton" class="ghost-button" type="button">Restablecer filtros</button>
        </section>

        <section id="speciesGrid" class="species-grid" aria-label="Fichas de especies"></section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
